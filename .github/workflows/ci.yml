name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: MyPy
        run: mypy app cli

  test:
    name: Tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: clipshare
          POSTGRES_PASSWORD: clipshare
          POSTGRES_DB: clipshare
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clipshare"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install ".[dev]"
      - name: Run tests
        env:
          DATABASE_URL: postgresql+psycopg://clipshare:clipshare@localhost:5432/clipshare
        run: pytest

  # M7 计划（开发方案 §6 待办「M6/M7 jsdom 冒烟接入 CI」，实现留 M7）：
  # 前端冒烟 tests/e2e/frontend_smoke.js 当前依赖宿主机手动执行（M5），
  # 需引入 package.json（jsdom 依赖）并新增本 job：build 通过后运行前端冒烟。
  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: [lint, test]  # 门禁串行：lint 与 test 通过后才构建镜像
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build .

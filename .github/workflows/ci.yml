name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  windows-script:
    name: Windows PowerShell sandbox parser
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Parse the PowerShell test entrypoints without executing them
        shell: pwsh
        run: |
          foreach ($script in @(
            './scripts/test-sandbox.ps1',
            './scripts/test-clients.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [void][Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script),
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -ne 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              throw "$script has parser errors."
            }
          }

  client-contracts:
    name: C1 .NET and Kotlin ENC1 contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Run fixed offline client contract containers
        shell: pwsh
        run: ./scripts/test-clients.ps1 -Mode Clients

  sandbox:
    name: G0 isolated lint, test, and E2E
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Run the dedicated test sandbox
        shell: pwsh
        run: ./scripts/test-sandbox.ps1 -Mode Full
      - name: Upload sandbox evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: clipshare-g0-sandbox-evidence
          path: |
            .sandbox/*/artifacts/
            .sandbox/*/logs/
          if-no-files-found: warn
          retention-days: 14

  build:
    name: Build production Docker image
    runs-on: ubuntu-latest
    needs: [windows-script, sandbox, client-contracts]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Build the production image without test sources
        run: docker build --tag clipshare:ci .

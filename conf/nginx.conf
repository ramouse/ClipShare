# ClipShare 生产反向代理配置（挂载为容器内 /etc/nginx/conf.d/default.conf，只读）
#
# 职责：唯一公网入口 → app:8000（FastAPI）
#   - 不记录访问日志（隐私红线：不记录客户端 IP，开发方案 §6 待办「生产 access log」落实项）
#   - 覆盖客户端伪造的 X-Forwarded-For（开发方案 §6 待办「slowapi XFF 信任」落实项）
#   - 本文件只监听 80；HTTPS/443 段见文末注释，配置 certbot 后启用

server {
    listen 80 default_server;
    server_name _;   # 通配匹配：支持 IP 直连；certbot --nginx 签发证书时会替换为实际域名

    # 隐私红线：关闭访问日志。应用层 uvicorn 亦以 --no-access-log 启动，双层保证不落客户端 IP。
    access_log off;
    # 错误日志保留并写入容器 stderr（nginx 官方镜像符号链接到 /dev/stderr，docker logs 可查）
    error_log /dev/stderr warn;

    # gzip 压缩（对反向代理响应必须显式开启 gzip_proxied，否则默认不压缩上游内容）
    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # 请求体上限：应用单条分享默认上限 100k 字符，留足余量（上传内容走 POST body）
    client_max_body_size 10m;

    # 静态资源直接由 app 提供（app/static 位于应用镜像内，proxy 即可，无需额外挂卷）。
    # 取舍说明：未在 nginx 层做静态缓存与 expires；当前规模下 app 直出足够、架构最简单。
    # 若后续静态流量变大，可把 static 提取为共享卷 + 本段改为 alias 直读 + 加缓存头。
    location /static/ {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        # 安全关键（开发方案 §6 待办落实）：用 $remote_addr 覆盖（而非追加）客户端头。
        # slowapi 限流的 key 取自 X-Forwarded-For 首值（security.py get_remote_address），
        # 若此处用 $proxy_add_x_forwarded_for 追加，客户端可伪造任意 IP 绕过限流。
        proxy_set_header X-Forwarded-For $remote_addr;
        # 上游按需识别协议（应用当前显式配置 PUBLIC_BASE_URL，此处为标准反代惯例）
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ==================== HTTPS 段（配置 certbot 后启用） ====================
# 前置条件：
#   1. 域名 A 记录解析到本服务器，安全组放行 443；
#   2. docker-compose.prod.yml 中 nginx 服务取消注释 "- 443:443" 并 up -d 生效；
#   3. 宿主机安装 certbot：apt install certbot python3-certbot-nginx；
#   4. 签发：certbot --nginx -d 你的域名   （certbot 会自动改写本文件为下述形态并开启自动续期）
# 完整步骤见 docs/DEPLOYMENT.md §5。
#
# 签发后本文件将变成（示意）：
# server {
#     listen 443 ssl http2;
#     server_name 你的域名;
#     ssl_certificate     /etc/letsencrypt/live/你的域名/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/你的域名/privkey.pem;
#     include /etc/letsencrypt/options-ssl-nginx.conf;
#     ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
#     ...（沿用上方 80 段相同的 location 与 access_log off / X-Forwarded-For 覆盖配置）...
# }
# server {
#     listen 80;
#     server_name 你的域名;
#     return 301 https://$host$request_uri;   # HTTP 全量跳转 HTTPS
# }
#
# 注意：certbot 改写后请复核以下两项仍保留（M6 安全清单）：
#   1. access_log off 仍在（隐私红线）；
#   2. proxy_set_header X-Forwarded-For $remote_addr; 仍在（覆盖而非追加）。
# 改完后重载生效：docker compose -f docker-compose.prod.yml exec nginx nginx -t
#                  docker compose -f docker-compose.prod.yml exec nginx nginx -s reload

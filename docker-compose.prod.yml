# 生产环境编排：app（INSTALL_DEV=false 纯运行镜像）+ PostgreSQL 16 + nginx 反向代理
#
# 与开发环境（docker-compose.yml，项目名 clipshare）物理隔离：本项目名固定为 clipshare-prod，
# 网络/卷/容器均带 clipshare-prod- 前缀，两个环境互不影响。
#
# 变量插值：docker compose 自动读取项目目录的 .env（无 .env 时取 shell 环境变量）；
# 所有 ${VAR:?错误信息} 的变量缺失时 compose 直接报错拒绝启动
# （12-Factor：密钥一律环境变量，禁止写入代码/仓库，见开发方案 §2 红线）。
#
# 用法：cp .env.prod.example .env 并填写 → bash scripts/deploy.sh
name: clipshare-prod

# 三个服务共用的日志驱动：json-file + 大小上限，防止日志膨胀占满磁盘
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    build:
      context: .
      args:
        # 生产镜像：不安装 pytest/ruff/mypy 等测试与代码检查工具（INSTALL_DEV=false）
        # cli 包位于主依赖内（pyproject.toml [project.scripts]），生产镜像包含 clipshare CLI
        INSTALL_DEV: "false"
    environment:
      # 数据库连接串：指向本编排的 db 服务（@db:5432）。
      # 注意：DATABASE_URL 内嵌的密码必须与 POSTGRES_PASSWORD 一致（.env.prod.example 有同步提示）
      DATABASE_URL: ${DATABASE_URL:?请在 .env 中配置 DATABASE_URL（见 .env.prod.example）}
      # 分享链接前缀（与 /s/{短码} 拼接）：有域名填 https://域名，无域名填 http://服务器IP
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?请在 .env 中配置 PUBLIC_BASE_URL（见 .env.prod.example）}
      # production 触发 structlog JSON 日志输出（logging.py 按此值切换渲染器）
      ENVIRONMENT: production
      APP_NAME: ${APP_NAME:-ClipShare}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # 单条分享内容长度上限（字符数）
      SHARE_MAX_CONTENT_LENGTH: ${SHARE_MAX_CONTENT_LENGTH:-100000}
      # slowapi 限流（按 IP 内存瞬时计数，不落库、不落日志；IP 仅用于限流判定）
      RATE_LIMIT_CREATE: ${RATE_LIMIT_CREATE:-30/minute}
      RATE_LIMIT_READ: ${RATE_LIMIT_READ:-60/minute}
      # ---- 文件分享 ----
      # 落盘目录：容器内路径，宿主卷挂载 ./data/files → /app/data/files（见下方 volumes）
      FILE_STORAGE_DIR: ${FILE_STORAGE_DIR:-/app/data/files}
      # 单文件上限 / E2E 加密上限 / 预览截断上限（字节）
      FILE_MAX_SIZE: ${FILE_MAX_SIZE:-104857600}
      FILE_ENCRYPT_MAX_SIZE: ${FILE_ENCRYPT_MAX_SIZE:-10485760}
      FILE_PREVIEW_MAX_SIZE: ${FILE_PREVIEW_MAX_SIZE:-204800}
      # 扩展名白名单（逗号分隔；默认值见 app/core/config.py，一般无需覆盖）
      FILE_ALLOWED_EXTENSIONS: ${FILE_ALLOWED_EXTENSIONS:-txt,md,json,py,js,ts,jsx,tsx,html,css,scss,java,c,cpp,h,go,rs,php,rb,sh,yaml,yml,toml,ini,cfg,conf,log,csv,tsv,xml,sql,pdf,doc,docx,xls,xlsx,ppt,pptx,rtf,odt,ods,odp,png,jpg,jpeg,gif,webp,bmp,ico,svg,avif,zip,rar,7z,tar,gz,bz2,xz,mp3,wav,ogg,flac,mp4,webm,mov,mkv}
      FILE_PREVIEW_EXTENSIONS: ${FILE_PREVIEW_EXTENSIONS:-txt,md,json,py,js,ts,jsx,tsx,html,css,java,c,cpp,h,go,rs,php,rb,sh,yaml,yml,toml,ini,cfg,conf,log,csv,tsv,xml,sql}
      # 文件相关限流（独立预算，与文本分享互不影响）
      RATE_LIMIT_UPLOAD: ${RATE_LIMIT_UPLOAD:-30/minute}
      RATE_LIMIT_FILE_READ: ${RATE_LIMIT_FILE_READ:-60/minute}
      RATE_LIMIT_FILE_DOWNLOAD: ${RATE_LIMIT_FILE_DOWNLOAD:-60/minute}
    volumes:
      # 文件分享持久化：宿主目录挂载（uid 1000，与镜像内固定 uid 对齐）；
      # 备份脚本（模块 E）随 pgdata 一并纳入快照
      - ./data/files:/app/data/files
    # 生产 CMD：无 --reload（运行镜像内源码快照，不挂载宿主机源码），
    # 保留 --no-access-log（隐私红线：服务端不记录客户端 IP:port，与 nginx access_log off 双保险）
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-access-log
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    # 健康检查：沿用 Dockerfile HEALTHCHECK（10s 间隔探测 /healthz），无需在此重复定义

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?请在 .env 中配置 POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中配置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-clipshare}
    volumes:
      - pgdata:/var/lib/postgresql/data   # 持久化卷：数据不随容器销毁，删除前务必先备份
    healthcheck:
      # 复用 dev 定义，并把用户/库名参数化（$$ 转义给容器内展开，避免被 compose 插值误吞）
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging: *default-logging
    # 不暴露端口：仅 Docker 内部网络（app/nginx）可访问，公网不可直连数据库

  nginx:
    image: nginx:alpine
    volumes:
      # 反向代理配置只读挂载（本机网络拉取失败时可用镜像源：
      # docker pull docker.m.daocloud.io/library/nginx:alpine && docker tag docker.m.daocloud.io/library/nginx:alpine nginx:alpine）
      - ./conf/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"    # 唯一暴露到宿主机/公网的端口；app/db 均不暴露（按需原则）
      # HTTPS 端口：certbot certonly --webroot 签发证书后启用（取消下一行注释，
      # 并按 docs/DEPLOYMENT.md §5 挂载证书/webroot 卷后执行 nginx -s reload）
      # - "443:443"
    depends_on:
      app:
        condition: service_healthy   # app 健康后才开始代理流量，避免 502 窗口
    restart: unless-stopped
    logging: *default-logging

volumes:
  pgdata:

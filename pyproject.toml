[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clipshare"
version = "0.1.0"
description = "轻量级云剪切板分享系统：匿名文本分享，支持有效期与访问次数控制"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "NAME" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "structlog>=24.4",
    "slowapi>=0.1.9",
    "qrcode[pil]>=7.4",
    # M4：页面模板（starlette.templating 需要，fastapi 基础安装不带 jinja2）
    "jinja2>=3.1",
    # M5 创新点 B：CLI 工具（httpx 由 dev 移入主依赖，CLI 运行时依赖）
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

# M5 创新点 B：CLI 命令行入口（clipshare send / clipshare get）
[project.scripts]
clipshare = "cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["app", "cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=app --cov=cli --cov-report=term-missing"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "S"]
ignore = ["S101"]

# FastAPI 的 Depends 属于「装饰性函数调用默认值」，是 B008 的合法豁免场景
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

# slowapi / qrcode 无类型桩（未提供 py.typed），放宽缺失类型标注的检查
[[tool.mypy.overrides]]
module = ["slowapi", "slowapi.*", "qrcode", "qrcode.*"]
ignore_missing_imports = true
